openapi: 3.0.3
info:
  title: Student Discovery Internal Runtime
  version: 1.0.0
  description: |
    B-01 Python-only session boundary; no public gateway route. Health is independent of these credentials.
    Calls use raw internal request targets under /api/v1/internal. JSON business body <=65536 bytes,
    X-Caller-Context JWT <=8192 bytes, release content from Product ports <=2097152 bytes.
    Verified owner comes only from signed caller context, environment only from runtime config (demo).
    TTL 3600 seconds from creation never slides. Content read/write blocked after end/exact expiry.
    Content retention 86400 seconds after effective closure; trace retention 86400 seconds from event.
    Caller authentication precedes service readiness. Missing either caller header returns 401
    AUTH_CALLER_CONTEXT_MISSING; malformed/duplicate headers, invalid or expired signatures, or an
    unavailable verifier return 401 AUTH_CALLER_CONTEXT_INVALID. These failures are nonretryable
    and disclose no service readiness. A valid signature is required before returning 503.
    Authenticated unavailable responses include Retry-After (seconds) and retryable=true;
    error.details.kind is not_configured for missing service configuration/capabilities, or
    dependency_down for an unavailable database/dependency. Health remains a liveness check.
    Contract registration does not claim implementation in the public TypeScript routes or clients.
servers:
  - url: /api/v1/internal
security:
  - InternalCallerContext: []
    InternalCallerIssuer: []
paths:
  /conversations:
    post:
      operationId: internalCreateConversation
      summary: Create conversation with pinned Agent and capability
      description: Resolve published Agent once; atomically persist snapshot, conversation revision 0, greeting and outcome. Same owner/key/input replays only while readable. Closed replay returns 410, changed input 409. Restart and activation do not alter existing pins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../public/conversation-api.yaml#/components/schemas/CreateConversationInput
      responses:
        '201':
          description: Conversation and greeting; replay preserves status/data and stable IDs with fresh request meta.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: ../public/conversation-api.yaml#/components/schemas/ConversationCreatedEnvelope
        default:
          $ref: '#/components/responses/RuntimeError'
  /conversations/{conversation_id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: internalReadConversation
      summary: Read authorized current conversation state
      description: Parent lifecycle checked before projection; closed/expired returns 410 with data null. GET does not materialize expiry, advance revision or resolve active releases.
      responses:
        '200':
          description: Current readable state.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: ../public/conversation-api.yaml#/components/schemas/ConversationEnvelope
        default:
          $ref: '#/components/responses/RuntimeError'
  /conversations/{conversation_id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: internalListConversationMessages
      summary: Read ordered history at a stable watermark
      description: Each page rechecks owner/lifecycle. Cursor HMAC uses a separate >=256-bit key; version, conversation ID, watermark revision and last ordinal only. Cursor grants no read permission. Closed history returns 410 with data null.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Ordered committed messages with next cursor and snapshot revision.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: ../public/conversation-api.yaml#/components/schemas/MessagePageEnvelope
        default:
          $ref: '#/components/responses/RuntimeError'
    post:
      operationId: internalSubmitConversationMessage
      tags:
        - Conversations
      summary: Gửi một message (text hoặc structured interaction), trả JSON hoặc SSE
      description: |-
        Một content part: text → Agent loop; interaction → Activity Engine (option click không cần LLM).
        Accept: application/json trả TurnResponseEnvelope khi turn kết thúc; Accept: text/event-stream trả ResponseStreamEvent
        (response.created → delta/tool_call → completed|cancelled|failed, `: ping` mỗi 15 giây, header X-Accel-Buffering: no,
        X-Request-ID, X-Trace-ID). Lỗi trước khi stream mở trả JSON envelope.
        Idempotency theo (owner, conversation, idempotency_key) trong responses: cùng key + cùng payload replay Response đã lưu;
        khác payload 409 CONFLICT_IDEMPOTENCY_KEY. Mỗi conversation chỉ một turn in_progress: turn thứ hai trả
        409 CONFLICT_TURN_IN_PROGRESS với details.response_id. expected_revision cũ trả 409 CONFLICT_REVISION.
        Turn bị bỏ dở quá hạn chuyển failed với SYS_TURN_ABANDONED. Model lỗi không làm failed: Response completed với
        block template. Text dài hơn limits.max_input_chars trả 422 VAL_INVALID_INPUT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/chat.yaml#/components/schemas/MessageInput
      responses:
        '200':
          description: Response đã kết thúc (JSON) hoặc luồng sự kiện (SSE).
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/chat.yaml#/components/schemas/TurnResponseEnvelope
            text/event-stream:
              schema:
                $ref: ../schemas/chat.yaml#/components/schemas/ResponseStreamEvent
        default:
          $ref: '#/components/responses/RuntimeError'
  /responses/{response_id}:
    parameters:
      - name: response_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^resp_[a-f0-9]{32}$
    get:
      operationId: internalGetResponse
      tags:
        - Conversations
      summary: Đọc Response theo id
      description: Owner-scoped; Response không tồn tại hoặc của owner khác trả 404 RES_NOT_FOUND. Dùng để lấy lại kết quả sau khi mất kết nối stream.
      responses:
        '200':
          description: Response hiện tại.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/chat.yaml#/components/schemas/TurnResponseEnvelope
        default:
          $ref: '#/components/responses/RuntimeError'
  /responses/{response_id}/cancel:
    parameters:
      - name: response_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^resp_[a-f0-9]{32}$
    post:
      operationId: internalCancelResponse
      tags:
        - Conversations
      summary: Hủy Response đang in_progress
      description: Chỉ Response in_progress hủy được (status cancelled, không commit gì); trạng thái khác trả 409 CONFLICT_RESPONSE_NOT_CANCELLABLE. Hủy lặp lại trên Response đã cancelled trả lại chính nó.
      responses:
        '200':
          description: Response sau khi hủy.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/chat.yaml#/components/schemas/TurnResponseEnvelope
        default:
          $ref: '#/components/responses/RuntimeError'
  /conversations/{conversation_id}:end:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      operationId: internalEndConversation
      summary: Close atomically and return minimal acknowledgement
      description: End/expiry closes children atomically without fabricating results. Exact deadline yields expired. End replay returns only the five acknowledgement fields; no additional revision/outcome/history/deadline update for new keys after closure. Changed input on a known key remains 409; purged resources return 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../public/conversation-api.yaml#/components/schemas/EndConversationInput
      responses:
        '200':
          description: Minimal effective closure acknowledgement.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: ../schemas/session-lifecycle.yaml#/components/schemas/ClosedConversationEnvelope
        default:
          $ref: '#/components/responses/RuntimeError'
  /activities/{activity_id}/result:
    parameters:
      - name: activity_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
    get:
      operationId: internalReadActivityResult
      summary: Read the stored current valid result projection
      description: Parent owner/lifecycle first, then validity/current result/revision. Closed parent returns 410; no scoring or release resolution on GET. Internal scores/evidence are not projected.
      parameters:
        - $ref: '#/components/parameters/ExpectedResultRevision'
      responses:
        '200':
          description: Stored safe result projection.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: ../public/activity-api.yaml#/components/schemas/ActivityResultEnvelope
        default:
          $ref: '#/components/responses/RuntimeError'
  /results/{result_id}/share-card:
    parameters:
      - name: result_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
    get:
      operationId: internalReadShareCard
      summary: Read stored summary.v1 allowlist
      description: Guard parent lifecycle, ownership and current valid result; closed parent returns 410 with data null. No internal scores/evidence, no generation or scoring on GET.
      parameters:
        - $ref: '#/components/parameters/ExpectedResultRevision'
      responses:
        '200':
          description: Stored ShareCard summary projection.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: ../public/result-api.yaml#/components/schemas/ShareCardEnvelope
        default:
          $ref: '#/components/responses/RuntimeError'
  /agent-snapshots:validate:
    post:
      operationId: internalValidateAgentSnapshot
      summary: Validate an agent config exactly as the runtime would load it
      description: |
        Studio as a service (`X-Internal-Caller: sda-studio-api`, claims `caller_type=studio_service`,
        `purpose=agent.validate`, no `owner_id`, keyring `RUNTIME_STUDIO_KEYRING`). Checks the agent.snapshot.v1 schema
        and its references (knowledge bases, display fields, allowed activity profiles). An invalid config is still
        200 with `valid=false` and `issues`; 422 INVALID_INPUT is only for a malformed request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Validation report bound to the canonical hash of the content.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [valid, content_hash, issues]
                    properties:
                      valid: {type: boolean}
                      content_hash: {type: string}
                      issues:
                        type: array
                        items:
                          type: object
                          required: [path, code, message]
                          properties:
                            path: {type: string}
                            code: {type: string}
                            message: {type: string}
        default:
          $ref: '#/components/responses/RuntimeError'
  /experience-validations:run:
    post:
      operationId: internalRunExperienceValidation
      summary: Validate a captured Experience definition snapshot and store the report
      description: |
        Studio as a service (`purpose=experience.validate`; see /agent-snapshots:validate for the token). The body
        is SnapshotCommandInput (experience-validation-api.yaml) plus the exact definition Studio captured. A
        content_hash that is not the RFC 8785 hash of `definition` is 409 CONFLICT_REVISION before any work; the
        runtime keeps no drafts, so expected_revision is recorded, not checked. The same idempotency_key returns
        the stored report; reusing it for another hash or revision is 409 CONFLICT_IDEMPOTENCY_KEY. Reports are
        held in bounded process memory: they do not survive a restart, and a later verify then fails closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceSnapshotCommand'
      responses:
        '200':
          description: The validation report (status may be failed or unsupported).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ../public/experience-validation-api.yaml#/components/schemas/ValidationReport
        default:
          $ref: '#/components/responses/RuntimeError'
  /experience-evaluations:run:
    post:
      operationId: internalRunExperienceEvaluation
      summary: Replay the golden cases of a captured Experience definition snapshot and store the report
      description: |
        Same caller, body, hash, idempotency and storage rules as /experience-validations:run, with
        `purpose=experience.evaluate`. Cases replay on the runtime selector and scorer. The report may carry
        report-level `issues` (validation failures, no mandatory case) in addition to per-case issues.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceSnapshotCommand'
      responses:
        '200':
          description: The evaluation report (status may be failed or unsupported).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ../public/experience-validation-api.yaml#/components/schemas/EvaluationReport
        default:
          $ref: '#/components/responses/RuntimeError'
  /experience-reports:verify:
    post:
      operationId: internalVerifyExperienceReports
      summary: Publish gate for an Experience release
      description: |
        Studio as a service (`purpose=experience.verify`). Mirrors studio-api PublishReportInput. Verified only when
        both reports are stored here, the validation report passed, the evaluation report has mandatory_passed
        (non-mandatory case failures do not block), and both match experience_id, definition_hash, schema and
        engine version. Anything else is 200 with verified=false and a reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [experience_id, definition_hash, definition_schema_version, engine_version, validation_id,
                evaluation_id]
              properties:
                experience_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
                definition_hash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
                definition_schema_version: {type: string, minLength: 1}
                engine_version: {type: string, minLength: 1}
                validation_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
                evaluation_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
      responses:
        '200':
          description: Gate verdict.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [verified, reason]
                    properties:
                      verified: {type: boolean}
                      reason: {type: string, nullable: true}
        default:
          $ref: '#/components/responses/RuntimeError'
  /knowledge/retrieval:
    post:
      operationId: internalRetrieveKnowledge
      tags:
        - Knowledge
      summary: Tìm kiếm trong knowledge base (hình dạng External Knowledge API của Dify)
      description: >-
        Tìm kết hợp vector + từ khoá trên revision đang active của từng document, lọc theo metadata
        (chỉ field filterable). Mỗi record là một chunk; top_k đếm theo chunk, mỗi document tối đa
        max_chunks_per_doc chunk. Điểm từ khoá là tỉ lệ từ (không dấu) của câu hỏi có trong chunk, kể cả heading.
        degraded=true khi không embed được câu hỏi (chỉ dùng điểm từ khoá).
        Ví dụ đầy đủ ở contracts/fixtures/knowledge-retrieval.json.
        Caller: Studio as a service (`X-Internal-Caller: sda-studio-api`, claims `caller_type=studio_service`,
        `purpose=knowledge.retrieval`, no `owner_id`, keyring `RUNTIME_STUDIO_KEYRING`). Studio tokens are rejected
        with 403 on every other route, and student tokens with 403 on every service route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [knowledge_id, query]
              properties:
                knowledge_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
                query: {type: string, minLength: 1, maxLength: 300}
                retrieval_setting:
                  type: object
                  additionalProperties: false
                  properties:
                    top_k: {type: integer, minimum: 1, maximum: 20, default: 4}
                    score_threshold: {type: number, minimum: 0, maximum: 1, default: 0}
                    semantic_weight: {type: number, minimum: 0, maximum: 1, default: 0.7}
                    max_chunks_per_doc: {type: integer, minimum: 1, maximum: 10, default: 3}
                metadata_condition:
                  type: object
                  additionalProperties: false
                  required: [conditions]
                  properties:
                    logical_operator: {type: string, enum: [and, or], default: and}
                    conditions:
                      type: array
                      minItems: 1
                      maxItems: 10
                      items:
                        type: object
                        additionalProperties: false
                        required: [name, comparison_operator]
                        properties:
                          name: {type: string}
                          comparison_operator:
                            type: string
                            enum: [is, is not, contains, not contains, start with, end with, empty, not empty,
                                   '=', '≠', '>', '<', '≥', '≤', before, after]
                          value:
                            oneOf:
                              - {type: string}
                              - {type: number}
                              - {type: array, items: {type: string}}
      responses:
        '200':
          description: Các record khớp, điểm cao trước.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [records, degraded]
                    properties:
                      degraded: {type: boolean}
                      records:
                        type: array
                        items:
                          type: object
                          required: [content, score, title, metadata]
                          properties:
                            content: {type: string}
                            score: {type: number, minimum: 0, maximum: 1}
                            title: {type: string}
                            metadata: {type: object}
        default:
          $ref: '#/components/responses/RuntimeError'

components:
  securitySchemes:
    InternalCallerContext:
      type: apiKey
      in: header
      name: X-Caller-Context
      description: |
        HS256 JWT only; JOSE typ=sda-internal+jwt and configured kid, no jku/jwk/x5u key lookup.
        Separate random >=256-bit runtime keyring, never cookie/login keys or snapshot content.
        Required claims iss=sda-product-bff, aud=sda-agent-runtime, caller_type=student, nonempty owner_id (at most 256 Unicode scalar characters / 1024 UTF-8 bytes; no lone surrogates or NUL),
        integer UTC iat/exp with iat <= now < exp and 0 < exp-iat <=60; no expiry leeway.
        Required method (uppercase), request_target (raw percent-encoded internal path plus raw query,
        unchanged ordering/bytes, no host/decoding), body_sha256 (lowercase SHA-256 hex of raw bytes).
        No owner from body/other headers; recheck caller expiry at final guarded write after DB lock.
    InternalCallerIssuer:
      type: apiKey
      in: header
      name: X-Internal-Caller
      description: Must equal signed issuer sda-product-bff; header alone grants no permission.
  parameters:
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
    ExpectedResultRevision:
      name: expected_result_revision
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 9007199254740991
  schemas:
    ExperienceSnapshotCommand:
      description: SnapshotCommandInput (experience-validation-api.yaml) plus the experience id and captured definition.
      type: object
      required: [experience_id, definition, expected_revision, content_hash, idempotency_key]
      properties:
        experience_id: {type: string, minLength: 1, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
        definition: {type: object, additionalProperties: true, description: Exact captured definition snapshot.}
        expected_revision: {type: integer, minimum: 0, maximum: 9007199254740991}
        content_hash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        idempotency_key: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
      additionalProperties: false
    AgentSnapshotV1:
      $ref: ../schemas/session-lifecycle.yaml#/components/schemas/AgentSnapshotV1
    ReleaseDescriptor:
      $ref: ../schemas/session-lifecycle.yaml#/components/schemas/ReleaseDescriptor
  responses:
    RuntimeError:
      description: |
        Typed error; data null for lifecycle failures, no forbidden state in details.
        401 AUTH_CALLER_CONTEXT_MISSING or AUTH_CALLER_CONTEXT_INVALID is nonretryable,
        evaluated before readiness, and never includes Retry-After or readiness details.
        404 unknown/mismatched owner, 409 revision/key/current-result conflict, 410 closed/expired,
        413 byte limit, 422 invalid input/cursor. Authenticated 503 SYS_UNAVAILABLE is retryable,
        includes Retry-After and details.kind=not_configured or dependency_down. No RAM-only fallback.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Retry-After:
          description: Present only for authenticated 503 responses; suggested delay in seconds.
          schema:
            type: integer
            minimum: 1
          example: 5
      content:
        application/json:
          schema:
            $ref: ../schemas/common.yaml#/components/schemas/ErrorEnvelope
          examples:
            missingCaller:
              value:
                status: 401
                success: false
                message: Authentication context is required.
                data: null
                error: {code: AUTH_CALLER_CONTEXT_MISSING, message: Authentication context is required., retryable: false, details: null}
                meta: {request_id: 11111111-1111-4111-8111-111111111111, trace_id: 22222222-2222-4222-8222-222222222222, timestamp: '2026-10-21T00:00:00.000Z', replayed: false}
            invalidCaller:
              value:
                status: 401
                success: false
                message: Authentication context is invalid.
                data: null
                error: {code: AUTH_CALLER_CONTEXT_INVALID, message: Authentication context is invalid., retryable: false, details: null}
                meta: {request_id: 11111111-1111-4111-8111-111111111111, trace_id: 22222222-2222-4222-8222-222222222222, timestamp: '2026-10-21T00:00:00.000Z', replayed: false}
            notConfigured:
              value:
                status: 503
                success: false
                message: The service is temporarily unavailable.
                data: null
                error: {code: SYS_UNAVAILABLE, message: The service is temporarily unavailable., retryable: true, details: {kind: not_configured}}
                meta: {request_id: 11111111-1111-4111-8111-111111111111, trace_id: 22222222-2222-4222-8222-222222222222, timestamp: '2026-10-21T00:00:00.000Z', replayed: false}
            dependencyDown:
              value:
                status: 503
                success: false
                message: The service is temporarily unavailable.
                data: null
                error: {code: SYS_UNAVAILABLE, message: The service is temporarily unavailable., retryable: true, details: {kind: dependency_down}}
                meta: {request_id: 11111111-1111-4111-8111-111111111111, trace_id: 22222222-2222-4222-8222-222222222222, timestamp: '2026-10-21T00:00:00.000Z', replayed: false}

