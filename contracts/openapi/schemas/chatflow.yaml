components:
  schemas:
    ChatflowIdentifier:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,39}$'
      description: Định danh ổn định của node, cạnh, biến hoặc persona case.
    ChatflowNodeType:
      type: string
      enum: [start, if_else, intent_classifier, llm, agent, knowledge_retrieval, tool, profile_propose, assign, answer, goto_flow]
      description: Loại node người dựng luồng dùng được; goto_flow chuyển sang nghiệp vụ khác trong cùng lượt. code, http, vòng lặp và nhánh song song chưa được hỗ trợ (workflow_node_type_unsupported).
    ChatflowVariable:
      type: object
      additionalProperties: false
      required: [name, type, default]
      properties:
        name: {$ref: '#/components/schemas/ChatflowIdentifier'}
        type: {type: string, enum: [string, number, boolean, enum, string_list]}
        values:
          type: array
          minItems: 1
          maxItems: 30
          uniqueItems: true
          items: {type: string, minLength: 1, pattern: '\S'}
          description: Bắt buộc với enum và chỉ enum mới có (workflow_variable_invalid).
        default:
          description: Phải hợp lệ với type (enum phải nằm trong values) và constraints; sai thì workflow_variable_invalid.
        description: {type: string, maxLength: 300, description: Ghi chú cho người dựng luồng; runtime không đọc.}
        constraints:
          type: object
          additionalProperties: false
          description: Ràng buộc theo type (khoá sai type hoặc tối thiểu lớn hơn tối đa thì workflow_variable_invalid).
          properties:
            min_length: {type: integer, minimum: 0, maximum: 4000, description: chỉ cho string}
            max_length: {type: integer, minimum: 0, maximum: 4000, description: chỉ cho string}
            minimum: {type: number, description: chỉ cho number}
            maximum: {type: number, description: chỉ cho number}
            integer: {type: boolean, description: chỉ cho number}
            max_items: {type: integer, minimum: 1, maximum: 100, description: chỉ cho string_list}
            item_max_length: {type: integer, minimum: 1, maximum: 1000, description: chỉ cho string_list}
    ChatflowNode:
      type: object
      additionalProperties: false
      required: [id, type]
      properties:
        id: {$ref: '#/components/schemas/ChatflowIdentifier'}
        type: {$ref: '#/components/schemas/ChatflowNodeType'}
        title: {type: string, minLength: 1, maxLength: 100, pattern: '\S'}
        description: {type: string, maxLength: 500, description: Ghi chú cho người dựng luồng; runtime không đọc và không gửi cho LLM.}
        config:
          type: object
          additionalProperties: true
          description: Schema theo loại node do runtime công bố qua danh mục loại node; kiểm sâu ở validator đồ thị.
        ui:
          type: object
          additionalProperties: false
          properties:
            position:
              type: object
              additionalProperties: false
              required: [x, y]
              properties:
                x: {type: number}
                y: {type: number}
          description: Chỉ phục vụ hiển thị; runtime bỏ qua nhưng content_hash vẫn đổi.
    ChatflowEdge:
      type: object
      additionalProperties: false
      required: [id, source, source_handle, target]
      properties:
        id: {$ref: '#/components/schemas/ChatflowIdentifier'}
        source: {$ref: '#/components/schemas/ChatflowIdentifier'}
        source_handle: {$ref: '#/components/schemas/ChatflowIdentifier'}
        target: {$ref: '#/components/schemas/ChatflowIdentifier'}
    ChatflowBudget:
      type: object
      additionalProperties: false
      properties:
        max_nodes: {type: integer, minimum: 1, default: 20}
        max_llm_calls: {type: integer, minimum: 1, default: 6}
        turn_timeout_ms: {type: integer, minimum: 1, default: 25000}
      description: Mặc định theo baseline DEC-24; trần cứng do validator đồ thị kiểm sau khi DEC-24 chốt.
    ChatflowFlow:
      type: object
      additionalProperties: false
      required: [id, title, entry, nodes]
      properties:
        id: {$ref: '#/components/schemas/ChatflowIdentifier'}
        title: {type: string, minLength: 1, maxLength: 100, pattern: '\S'}
        description: {type: string, maxLength: 300, description: Router gửi mô tả này cho LLM để chọn nghiệp vụ; bắt buộc khi routable (workflow_flow_invalid).}
        examples:
          type: array
          maxItems: 5
          items: {type: string, minLength: 1, maxLength: 200, pattern: '\S'}
          description: Câu mẫu giúp router chọn nghiệp vụ.
        trigger:
          type: object
          nullable: true
          additionalProperties: true
          description: Điều kiện JSONLogic (DEC-23). Khớp thì vào nghiệp vụ này trước mọi cách chọn khác, theo thứ tự flows.
        routable: {type: boolean, default: true, description: false thì chỉ vào được qua trigger hoặc goto_flow.}
        entry: {$ref: '#/components/schemas/ChatflowIdentifier'}
        nodes:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/ChatflowNode'}
        edges:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ChatflowEdge'}
      description: Một nghiệp vụ. id không được là other hoặc error (workflow_flow_invalid).
    ChatflowRouter:
      type: object
      additionalProperties: false
      required: [default_flow]
      properties:
        default_flow: {$ref: '#/components/schemas/ChatflowIdentifier'}
        model: {type: string, minLength: 1, nullable: true, description: Bỏ trống để dùng model của agent.}
        instructions: {type: string, maxLength: 2000}
        history_messages: {type: integer, minimum: 0, maximum: 6, default: 0}
      description: Router do runtime sở hữu; mỗi lượt chọn nghiệp vụ theo trigger, rồi phân loại theo mô tả và câu mẫu, không khớp thì default_flow.
    ChatflowWorkflow:
      type: object
      additionalProperties: false
      required: [router, flows]
      properties:
        variables:
          type: array
          maxItems: 60
          items: {$ref: '#/components/schemas/ChatflowVariable'}
          description: Biến conv.* dùng chung cho mọi nghiệp vụ.
        budget: {$ref: '#/components/schemas/ChatflowBudget'}
        router: {$ref: '#/components/schemas/ChatflowRouter'}
        flows:
          type: array
          minItems: 1
          maxItems: 10
          items: {$ref: '#/components/schemas/ChatflowFlow'}
      description: Trùng id (biến, nghiệp vụ, node hoặc cạnh trong một nghiệp vụ) là duplicate_items; id node phải duy nhất trên toàn agent (workflow_node_id_duplicate); id node sys, conv, profile, result, router là workflow_node_id_reserved. Kiểm DAG, handle, biểu thức, tool, KB, trigger và goto_flow thuộc validator đồ thị.
    ChatflowPersonaTurn:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          type: object
          additionalProperties: false
          description: "Đúng một trong text hoặc interaction."
          properties:
            text: {type: string, minLength: 1, maxLength: 4000}
            interaction:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: {type: string, minLength: 1}
                outcome: {type: string, minLength: 1}
                option_id: {type: string, minLength: 1}
          oneOf:
            - required: [text]
            - required: [interaction]
        llm_stubs:
          type: object
          additionalProperties: true
          description: Output cố định cho từng node gọi model, khóa là node id.
        expect:
          type: object
          additionalProperties: false
          description: "Kỳ vọng sau lượt. path khớp chính xác, đúng thứ tự; conv chỉ kiểm các khóa được liệt kê."
          properties:
            path: {type: array, items: {$ref: '#/components/schemas/ChatflowIdentifier'}}
            blocks_present: {type: array, items: {type: string, enum: [text, markdown, suggestions, assessment_question, assessment_clarification, personality_card, knowledge_card]}}
            blocks_absent: {type: array, items: {type: string, enum: [text, markdown, suggestions, assessment_question, assessment_clarification, personality_card, knowledge_card]}}
            conv: {type: object, additionalProperties: true}
            proposals: {type: integer, minimum: 0}
            status: {type: string, enum: [completed, fallback]}
    ChatflowPersonaCase:
      type: object
      additionalProperties: false
      required: [id, title, turns]
      properties:
        id: {$ref: '#/components/schemas/ChatflowIdentifier'}
        title: {type: string, minLength: 1, maxLength: 100, pattern: '\S'}
        mandatory: {type: boolean, default: false}
        initial_state:
          type: object
          additionalProperties: false
          description: "Trạng thái giả lập ban đầu; hồ sơ, result, activity giữ nguyên qua các lượt, conv.* chuyển tiếp từ lượt trước."
          properties:
            profile: {type: object, additionalProperties: true}
            result: {type: object, nullable: true, additionalProperties: true}
            conv: {type: object, additionalProperties: true}
            activity: {type: object, nullable: true, additionalProperties: true}
        turns:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/ChatflowPersonaTurn'}
