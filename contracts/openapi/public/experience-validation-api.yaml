openapi: 3.0.3
info:
  title: Student Discovery - Experience Validation and Evaluation
  version: 1.0.0
  description: Contract theo resource. Quy ước chung và các quyết định còn mở nằm trong admin-api.yaml; xem README.md
    để chọn nhóm API. Schema dùng chung được tham chiếu bằng $ref.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development server
  - url: https://api.example.com/api/v1
    description: Production server
tags:
  - name: Studio Experiences
    description: Metadata/draft, validation/evaluation and isolated preview.
paths:
  /admin/experiences/{id}/validations:
    post:
      operationId: createExperienceValidation
      tags:
        - Studio Experiences
      summary: Tạo validations trên exact snapshot
      description: Synchronous report/preview resource in MVP. Capture exact draft revision/hash/schema/engine;
        report stale if content changes. Unsupported DEC-04 profiles return unsupported, never pass. Preview is
        isolated and excludes production analytics/results/active pointer. Async report GET endpoints can be added
        after job protocol is chosen.
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationEnvelope'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotCommandInput'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      x-required-permission: experience.config.validate
  /admin/experiences/{id}/evaluations:
    post:
      operationId: createExperienceEvaluation
      tags:
        - Studio Experiences
      summary: Tạo evaluations trên exact snapshot
      description: Synchronous report/preview resource in MVP. Capture exact draft revision/hash/schema/engine;
        report stale if content changes. Unsupported DEC-04 profiles return unsupported, never pass. Preview is
        isolated and excludes production analytics/results/active pointer. Async report GET endpoints can be added
        after job protocol is chosen.
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Validated envelope; status matches HTTP response.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationEnvelope'
        '400':
          $ref: ../schemas/common.yaml#/components/responses/ChatError400
        '401':
          $ref: ../schemas/common.yaml#/components/responses/ChatError401
        '403':
          $ref: ../schemas/common.yaml#/components/responses/ChatError403
        '404':
          $ref: ../schemas/common.yaml#/components/responses/ChatError404
        '409':
          $ref: ../schemas/common.yaml#/components/responses/ChatError409
        '410':
          $ref: ../schemas/common.yaml#/components/responses/ChatError410
        '413':
          $ref: ../schemas/common.yaml#/components/responses/ChatError413
        '422':
          $ref: ../schemas/common.yaml#/components/responses/ChatError422
        '429':
          $ref: ../schemas/common.yaml#/components/responses/ChatError429
        '500':
          $ref: ../schemas/common.yaml#/components/responses/ChatError500
        '503':
          $ref: ../schemas/common.yaml#/components/responses/ChatError503
        '504':
          $ref: ../schemas/common.yaml#/components/responses/ChatError504
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotCommandInput'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      x-required-permission: experience.config.evaluate
components:
  schemas:
    SnapshotCommandInput:
      type: object
      properties:
        expected_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        content_hash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        idempotency_key:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      required:
        - expected_revision
        - content_hash
        - idempotency_key
      additionalProperties: false
      description: expected_revision thuộc draft. Capture exact immutable snapshot/hash; reject stale revision/hash
        before work. Reports/preview refer to this captured snapshot.
    ValidationReport:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        experience_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        draft_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        content_hash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        definition_schema_version:
          type: string
          minLength: 1
        engine_version:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - passed
            - failed
            - unsupported
        mandatory_passed:
          type: boolean
        issues:
          type: array
          items:
            $ref: ../schemas/common.yaml#/components/schemas/ValidationIssue
        created_at:
          type: string
          format: date-time
          pattern: Z$
      required:
        - id
        - experience_id
        - draft_revision
        - content_hash
        - definition_schema_version
        - engine_version
        - status
        - mandatory_passed
        - issues
        - created_at
      additionalProperties: true
    EvaluationCaseResult:
      type: object
      properties:
        case_id:
          type: string
          minLength: 1
          description: Echoes the golden case id (experience-api.yaml), so it accepts the same alphabet.
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        mandatory:
          type: boolean
        passed:
          type: boolean
        expected:
          type: object
        actual:
          type: object
        issues:
          type: array
          items:
            $ref: ../schemas/common.yaml#/components/schemas/ValidationIssue
      required:
        - case_id
        - mandatory
        - passed
        - expected
        - actual
        - issues
      additionalProperties: true
    EvaluationReport:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        experience_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        draft_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        content_hash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        definition_schema_version:
          type: string
          minLength: 1
        engine_version:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - passed
            - failed
            - unsupported
        mandatory_passed:
          type: boolean
        cases:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationCaseResult'
        created_at:
          type: string
          format: date-time
          pattern: Z$
      required:
        - id
        - experience_id
        - draft_revision
        - content_hash
        - definition_schema_version
        - engine_version
        - status
        - mandatory_passed
        - cases
        - created_at
      additionalProperties: true
    ValidationEnvelope:
      oneOf:
        - allOf:
            - $ref: ../schemas/common.yaml#/components/schemas/SuccessEnvelope
            - type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/ValidationReport'
        - $ref: ../schemas/common.yaml#/components/schemas/ErrorEnvelope
    EvaluationEnvelope:
      oneOf:
        - allOf:
            - $ref: ../schemas/common.yaml#/components/schemas/SuccessEnvelope
            - type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/EvaluationReport'
        - $ref: ../schemas/common.yaml#/components/schemas/ErrorEnvelope
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin JWT access token required for protected admin endpoints
