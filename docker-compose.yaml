# Local/dev orchestration. API/db/minio settings are compose-interpolated from shell variables or a
# root `.env` file (never committed); the defaults below are LOCAL-ONLY. agent-runtime reads its own
# optional apps/agent-runtime/.env. Do not use these defaults outside a local machine.
name: sda

services:
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "3000:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web-ui:
        condition: service_healthy
      studio-api:
        condition: service_healthy
    restart: unless-stopped

  web-ui:
    build:
      context: ./apps/web-ui
      additional_contexts:
        contracts: ./contracts
      target: runner
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    environment:
      STUDIO_API_ORIGIN: http://studio-api:3001
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  studio-api:
    build:
      context: ./apps/studio-api
      additional_contexts:
        contracts: ./contracts
      target: runner
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sda:${POSTGRES_PASSWORD:-sda-local-dev}@db:5432/sda}
      # LOCAL-ONLY default; set a strong SECRET_KEY anywhere else.
      SECRET_KEY: ${SECRET_KEY:-sda-local-dev-secret-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # No default: empty disables admin login (401). Set ADMIN_PASSWORD to enable it.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sda-local-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-sda-local-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-sda-private}
      MINIO_PUBLIC_BUCKET_NAME: ${MINIO_PUBLIC_BUCKET_NAME:-sda-public}
      PRODUCT_BASE_URL: ${PRODUCT_BASE_URL:-http://localhost:3000}
      RUNTIME_READY_URL: ${RUNTIME_READY_URL:-http://agent-runtime:8000/ready}
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  agent-runtime:
    build:
      context: ./apps/agent-runtime
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    env_file:
      - path: ./apps/agent-runtime/.env
        required: false
    # No host port; reachable only on the compose network. No Product DB/JWT credentials here.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional/legacy: the runtime indexes on demand when Studio writes (RUNTIME_KNOWLEDGE_INDEXER_DATABASE_URL).
  # This always-on LISTEN worker is kept only for setups without that wiring.
  knowledge-indexer:
    build:
      context: ./apps/agent-runtime
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    command: ["python", "-m", "agent_runtime.cli.knowledge_indexer"]
    env_file:
      - path: ./apps/agent-runtime/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sda-local-dev}
      POSTGRES_DB: sda
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sda -d sda"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    # Pinned release tag; bump deliberately.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sda-local-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-sda-local-minio-secret}
    command: server /data --address ':9000' --console-address ':9001'
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  # Explicit one-shot tools (profile "tools"); never run on startup.
  studio-api-migrate:
    profiles: [tools]
    build:
      context: ./apps/studio-api
      additional_contexts:
        contracts: ./contracts
      target: migration
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    environment:
      # Operator-provided; defaults to the compose db for local use only.
      DATABASE_URL: ${DATABASE_URL:-postgresql://sda:${POSTGRES_PASSWORD:-sda-local-dev}@db:5432/sda}
    depends_on:
      db:
        condition: service_healthy

  minio-init:
    profiles: [tools]
    # Reuse the pinned server image, which includes the official mc client.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sda-local-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-sda-local-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-sda-private}
      MINIO_PUBLIC_BUCKET_NAME: ${MINIO_PUBLIC_BUCKET_NAME:-sda-public}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET local/$$MINIO_PUBLIC_BUCKET_NAME &&
      mc anonymous set download local/$$MINIO_PUBLIC_BUCKET_NAME"

volumes:
  pg_data:
  minio_data:
