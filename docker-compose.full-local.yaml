# Standalone, localhost-only test stack. Never reuses the main sda project's volumes.
name: sda-full-local

services:
  gateway:
    extends:
      file: docker-compose.yaml
      service: gateway
    ports: !override
      - "127.0.0.1:${SDA_LOCAL_PORT:-3000}:80"

  web-ui:
    extends:
      file: docker-compose.yaml
      service: web-ui
    image: sda-full-local-web-ui:local
    build:
      args:
        # Real chat through the studio-api BFF instead of the in-memory mock.
        NEXT_PUBLIC_CHAT_MOCK: "false"

  studio-api:
    extends:
      file: docker-compose.yaml
      service: studio-api
    image: sda-full-local-studio-api:local
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://sda_local:${SDA_LOCAL_DB_PASSWORD:?Run scripts/local-stack.sh init}@db:5432/sda_local
      SECRET_KEY: ${SDA_LOCAL_SECRET_KEY:?Run scripts/local-stack.sh init}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${SDA_LOCAL_ADMIN_PASSWORD:?Run scripts/local-stack.sh init}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: sda-local-minio
      S3_SECRET_KEY: ${SDA_LOCAL_MINIO_PASSWORD:?Run scripts/local-stack.sh init}
      S3_BUCKET: sda-local-private
      MINIO_PUBLIC_BUCKET_NAME: sda-local-public
      PRODUCT_BASE_URL: http://localhost:${SDA_LOCAL_PORT:-3000}
      RUNTIME_READY_URL: http://agent-runtime:8000/ready
      AUTH_TRUSTED_PROXY_HOSTS: gateway
      # Knowledge Studio: least-privilege kb_studio role on the runtime database, signed calls to the runtime.
      KNOWLEDGE_DATABASE_URL: postgresql://kb_studio:${SDA_LOCAL_KB_STUDIO_PASSWORD:?Run scripts/local-stack.sh init}@db:5432/sda_runtime
      KNOWLEDGE_EMBEDDING_MODELS: ${SDA_LOCAL_KNOWLEDGE_EMBEDDING_MODEL:-gemini-embedding-2}
      RUNTIME_INTERNAL_URL: http://agent-runtime:8000
      STUDIO_RUNTIME_SIGNING_KEY: ${SDA_LOCAL_STUDIO_RUNTIME_KEY:?Run scripts/local-stack.sh init}
      STUDIO_RUNTIME_SIGNING_KID: studio
      # Student chat BFF: signs caller context with the runtime's RUNTIME_INTERNAL_KEYRING key `local`.
      PRODUCT_RUNTIME_SIGNING_KEY: ${SDA_LOCAL_RUNTIME_INTERNAL_KEY:?Run scripts/local-stack.sh init}
      PRODUCT_RUNTIME_SIGNING_KID: local
      # Runtime -> studio-api agent delivery (verify side of SDA_LOCAL_RUNTIME_PRODUCT_KEY).
      PRODUCT_DELIVERY_VERIFY_KEY: ${SDA_LOCAL_RUNTIME_PRODUCT_KEY:?Run scripts/local-stack.sh init}
      PRODUCT_DELIVERY_VERIFY_KID: runtime

  agent-runtime:
    extends:
      file: docker-compose.yaml
      service: agent-runtime
    image: sda-agent-runtime:local
    ports:
      - "127.0.0.1:${SDA_LOCAL_RUNTIME_PORT:-18000}:8000"
    environment:
      RUNTIME_ENVIRONMENT: demo
      RUNTIME_DATABASE_URL: postgresql+psycopg://sda_local:${SDA_LOCAL_DB_PASSWORD:?Run scripts/local-stack.sh init}@db:5432/sda_runtime
      RUNTIME_INTERNAL_KEYRING: '{"local":"${SDA_LOCAL_RUNTIME_INTERNAL_KEY:?Run scripts/local-stack.sh init}"}'
      RUNTIME_STUDIO_KEYRING: '{"studio":"${SDA_LOCAL_STUDIO_RUNTIME_KEY:?Run scripts/local-stack.sh init}"}'
      RUNTIME_CURSOR_SIGNING_KEY: ${SDA_LOCAL_RUNTIME_CURSOR_KEY:?Run scripts/local-stack.sh init}
      # Same list as Studio's KNOWLEDGE_EMBEDDING_MODELS: the runtime embeds with whichever one a KB picked.
      KNOWLEDGE_EMBEDDING_MODELS: ${SDA_LOCAL_KNOWLEDGE_EMBEDDING_MODEL:-gemini-embedding-2}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Studio writes kick indexing inside the runtime (no separate worker); it embeds through this connection.
      RUNTIME_KNOWLEDGE_INDEXER_DATABASE_URL: postgresql+psycopg://sda_local:${SDA_LOCAL_DB_PASSWORD:?Run scripts/local-stack.sh init}@db:5432/sda_runtime
      # Offline mode follows the model list: SDA_LOCAL_KNOWLEDGE_EMBEDDING_MODEL=fake-embedding is enough.
      # OpenAI-compatible vLLM / LiteLLM proxy: chat provider `vllm` and the vLLM embedding models.
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      # The agent comes from studio-api (signed pull); experiences/ still come from the local releases dir.
      RUNTIME_AGENT_RELEASE_SOURCE: product
      RUNTIME_PRODUCT_URL: http://studio-api:3001
      RUNTIME_PRODUCT_SIGNING_KEY: ${SDA_LOCAL_RUNTIME_PRODUCT_KEY:?Run scripts/local-stack.sh init}
      RUNTIME_PRODUCT_SIGNING_KID: runtime
      # Local releases (experiences/) instead of Product.
      RUNTIME_LOCAL_RELEASES_DIR: /releases
      # Outbound proxy for provider calls when the host has no direct route (empty = direct).
      PROXY_HOST: ${SDA_LOCAL_PROXY_HOST:-}
      PROXY_PORT: ${SDA_LOCAL_PROXY_PORT:-}
    volumes:
      - ./infra/local-releases:/releases:ro
    depends_on:
      db:
        condition: service_healthy

  # One-shot (profile tools): runtime database, knowledge roles, migrations/grants and the IHRD demo KB.
  runtime-provision:
    image: sda-agent-runtime:local
    profiles: ["tools"]
    command: ["python", "/provision/runtime-provision.py"]
    volumes:
      - ./scripts/runtime-provision.py:/provision/runtime-provision.py:ro
    environment:
      ADMIN_DATABASE_URL: postgresql://sda_local:${SDA_LOCAL_DB_PASSWORD:?Run scripts/local-stack.sh init}@db:5432/sda_local
      RUNTIME_DATABASE_NAME: sda_runtime
      KB_STUDIO_PASSWORD: ${SDA_LOCAL_KB_STUDIO_PASSWORD:?Run scripts/local-stack.sh init}
      KNOWLEDGE_EMBEDDING_MODEL: ${SDA_LOCAL_KNOWLEDGE_EMBEDDING_MODEL:-gemini-embedding-2}
    depends_on:
      db:
        condition: service_healthy

  db:
    extends:
      file: docker-compose.yaml
      service: db
    environment:
      POSTGRES_USER: sda_local
      POSTGRES_PASSWORD: ${SDA_LOCAL_DB_PASSWORD:?Run scripts/local-stack.sh init}
      POSTGRES_DB: sda_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sda_local -d sda_local"]

  minio:
    extends:
      file: docker-compose.yaml
      service: minio
    environment:
      MINIO_ROOT_USER: sda-local-minio
      MINIO_ROOT_PASSWORD: ${SDA_LOCAL_MINIO_PASSWORD:?Run scripts/local-stack.sh init}
    ports: !override
      - "127.0.0.1:${SDA_LOCAL_MINIO_PORT:-19001}:9001"

  studio-api-migrate:
    extends:
      file: docker-compose.yaml
      service: studio-api-migrate
    image: sda-full-local-studio-api-migrate:local
    environment:
      DATABASE_URL: postgresql://sda_local:${SDA_LOCAL_DB_PASSWORD:?Run scripts/local-stack.sh init}@db:5432/sda_local

  # One-shot (profile tools): seed the agent draft/v1/pointer from infra/local-releases/agent.json when empty.
  studio-api-seed-agent:
    extends:
      file: docker-compose.yaml
      service: studio-api-migrate
    image: sda-full-local-studio-api-migrate:local
    profiles: ["tools"]
    command: ["pnpm", "db:seed-agent", "/seed/agent.json"]
    volumes:
      - ./infra/local-releases/agent.json:/seed/agent.json:ro
    environment:
      DATABASE_URL: postgresql://sda_local:${SDA_LOCAL_DB_PASSWORD:?Run scripts/local-stack.sh init}@db:5432/sda_local
      SECRET_KEY: ${SDA_LOCAL_SECRET_KEY:?Run scripts/local-stack.sh init}

  minio-init:
    extends:
      file: docker-compose.yaml
      service: minio-init
    environment:
      MINIO_ROOT_USER: sda-local-minio
      MINIO_ROOT_PASSWORD: ${SDA_LOCAL_MINIO_PASSWORD:?Run scripts/local-stack.sh init}
      S3_BUCKET: sda-local-private
      MINIO_PUBLIC_BUCKET_NAME: sda-local-public

volumes:
  pg_data:
  minio_data:
