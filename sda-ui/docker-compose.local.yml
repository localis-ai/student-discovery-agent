# Chạy frontend ghép chung mạng với backend (sda-backend/docker-compose.local.yml).
# Backend đã tạo network external tên "sda-network" và service "api".
#
# Khởi động BE trước (để network tồn tại), rồi:
#   docker compose -f docker-compose.local.yml up --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Trong mạng docker, gọi backend qua service name "api" cổng nội bộ 8000.
      - API_BASE_URL=http://api:8000/api/v1
      - AUTH_COOKIE_ACCESS=sda_access
      - AUTH_COOKIE_REFRESH=sda_refresh
      - NODE_ENV=production
    networks:
      - sda-network

networks:
  sda-network:
    external: true
